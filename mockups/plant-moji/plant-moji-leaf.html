<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant-moji — one-leaf direction (throwaway)</title>
<style>
  :root { --ink:#22201c; --paper:#f3efe6; --line:#d9d2c3; --acc:#e2492f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family: "Avenir Next", "Hiragino Sans", system-ui, sans-serif; }
  main { max-width:1160px; margin:0 auto; padding:56px 36px 80px; }
  .tag { font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; }
  h1 { font-family:"Iowan Old Style", "Hiragino Mincho ProN", Georgia, serif; font-weight:400; font-size:44px; margin:10px 0 8px; letter-spacing:-.01em; }
  h2 { font-family:"Iowan Old Style", "Hiragino Mincho ProN", Georgia, serif; font-weight:400; font-size:24px; margin:64px 0 6px; }
  p.lead { font-size:17px; margin:0; max-width:620px; line-height:1.6; opacity:.8; }
  .hero { display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin:44px 0 20px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .hero > div { padding:22px 0 18px; text-align:center; }
  .hero > div + div { border-left:1px solid var(--line); }
  .hero svg { width:220px; height:auto; }
  .cap { font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; margin-top:4px; }
  .cap b { font-family:"Hiragino Mincho ProN", serif; font-weight:400; font-size:15px; letter-spacing:.04em; text-transform:none; opacity:1; margin-right:8px; }
  .table { display:grid; grid-template-columns:128px repeat(8,1fr); align-items:center; }
  .head { text-align:center; padding-bottom:12px; font-family:"Hiragino Mincho ProN", serif; font-size:15px; }
  .head small { display:block; font-family:"Avenir Next", system-ui, sans-serif; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; margin-top:3px; }
  .plant, .cell { border-top:1px solid var(--line); height:100%; display:flex; flex-direction:column; justify-content:center; }
  .plant b { font-family:"Iowan Old Style", Georgia, serif; font-weight:400; font-size:19px; }
  .plant span { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.55; margin-top:2px; }
  .cell { padding:8px 6px; }
  .cell svg { width:100%; height:auto; display:block; }
  .chat { border-top:1px solid var(--line); max-width:520px; margin-top:16px; }
  .row { display:flex; align-items:center; gap:12px; font-size:15px; padding:8px 0; border-bottom:1px solid var(--line); }
  .row svg { width:46px; height:46px; flex:none; }
  .n { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.6; min-width:118px; }
</style>
</head>
<body>
<main>
  <div class="tag">Concept sketch · throwaway · not final art</div>
  <h1>Plant-moji</h1>
  <p class="lead">One leaf, cut like folded paper. The feeling is in the gesture; a single vermilion accent does the rest. No outline, no pot, no face.</p>

  <div class="hero" id="hero"></div>

  <div class="table" id="table"></div>

  <h2>In a message</h2>
  <div class="chat" id="chat"></div>
</main>

<script>
const INK = '#22201c', ACC = '#e2492f';
const svg = body => `<svg viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg"><defs>
  <clipPath id="rh"><rect x="0" y="-90" width="70" height="110"/></clipPath>
  <clipPath id="fh"><rect x="60" y="0" width="60" height="124"/></clipPath>
  <linearGradient id="flush" gradientUnits="userSpaceOnUse" x1="0" y1="-70" x2="0" y2="-14"><stop offset="0" stop-color="#ee5a44"/><stop offset=".45" stop-color="#ee5a44" stop-opacity=".75"/><stop offset="1" stop-color="#ee5a44" stop-opacity="0"/></linearGradient></defs>${body}</svg>`;
const T = (x, y, s = 1, r = 0, sy = s) => `transform="translate(${x} ${y}) rotate(${r}) scale(${s} ${sy})"`;
const two = (d, a, b) => `<path d="${d}" fill="${a}"/><path d="${d}" fill="${b}" clip-path="url(#rh)"/>`;
const hair = (d, c = INK, w = 1.8) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

// leaf blades: base at 0,0, pointing up, about 68 tall; light half / dark half
const SHAPES = {
  heart: (a, b) => two('M0 -6 C -10 6 -36 -2 -31 -30 C -27 -50 -8 -58 0 -68 C 8 -58 27 -50 31 -30 C 36 -2 10 6 0 -6Z', a, b),
  monstera: (a, b) => two('M0 -6 C 10 6 34 2 33 -20 L 14 -23 L 31 -34 C 29 -44 24 -50 18 -55 L 8 -42 L 8 -62 C 5 -65 2 -67 0 -69 C -2 -67 -5 -65 -8 -62 L -8 -42 L -18 -55 C -24 -50 -29 -44 -31 -34 L -14 -23 L -33 -20 C -34 2 -10 6 0 -6Z', a, b),
  ginkgo: (a, b) => two('M0 0 C -4 -18 -40 -26 -38 -48 C -30 -64 -10 -60 0 -50 C 10 -60 30 -64 38 -48 C 40 -26 4 -18 0 0Z', a, b),
  fern: (a, b) => { let s = hair('M0 0 V-60', b, 1.6);
    for (let k = 0; k < 6; k++) { const y = -8 - k * 9.5, rx = 15 - k * 1.9, ry = 5 - k * .42;
      s += `<ellipse cx="${-rx}" cy="${y}" rx="${rx}" ry="${ry}" fill="${a}" transform="rotate(22 0 ${y})"/><ellipse cx="${rx}" cy="${y}" rx="${rx}" ry="${ry}" fill="${b}" transform="rotate(-22 0 ${y})"/>`; }
    return s + `<ellipse cx="0" cy="-66" rx="3.6" ry="7" fill="${a}"/>`; },
  cactus: (a, b) => `<ellipse cx="17" cy="-60" rx="9" ry="11" fill="${b}"/><ellipse cx="0" cy="-32" rx="23" ry="32" fill="${a}"/><ellipse cx="0" cy="-32" rx="23" ry="32" fill="${b}" clip-path="url(#rh)"/>` +
    [[-9,-44],[9,-36],[-5,-22],[10,-16],[-12,-30]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.1" fill="#f3efe6"/>`).join(''),
};

// quiet marks: hairlines in ink, one accent
const rays = (cx, cy, r1, r2, from, to, step) => { let d = '';
  for (let a = from; a <= to; a += step) { const r = a * Math.PI / 180;
    d += `M${(cx + r1 * Math.cos(r)).toFixed(1)} ${(cy + r1 * Math.sin(r)).toFixed(1)} L${(cx + r2 * Math.cos(r)).toFixed(1)} ${(cy + r2 * Math.sin(r)).toFixed(1)} `; }
  return hair(d, ACC, 2); };
const sun = `<circle cx="97" cy="24" r="8" fill="${ACC}"/>`;
const heart = (x, y, s) => `<path ${T(x, y, s, -10)} d="M0 8 C -15 -3 -8 -14 0 -6 C 8 -14 15 -3 0 8Z" fill="${ACC}"/>`;
const dropD = 'M0 -11 C 8 0 8 9 0 9 C -8 9 -8 0 0 -11Z';
const dropInk = (x, y, s) => `<path ${T(x, y, s)} d="${dropD}" fill="${INK}"/>`;
const dropLine = (x, y, s) => `<g ${T(x, y, s, 14)}>${hair(dropD, INK, 2.4)}</g>`;
const bolt = hair('M90 12 l8 11 l-9 2 l8 12', INK, 2.2);
const heat = (x, y) => `<g transform="translate(${x} ${y})">${hair('M0 0 q-5 -6 0 -12 q5 -6 0 -12')}</g>`;
const FLAME = 'M60 121 C 18 121 12 79 34 55 C 34 71 43 73 45 63 C 45 37 58 29 60 7 C 70 31 92 41 85 67 C 91 63 93 55 91 49 C 110 79 102 121 60 121Z';
const flame = `<path d="${FLAME}" fill="#e2492f"/><path d="${FLAME}" fill="#c23a22" clip-path="url(#fh)"/>`;
const cheeks = hair('M-15 -38 l-4 9 M-10 -38 l-4 9 M-5 -38 l-4 9 M7 -38 l-4 9 M12 -38 l-4 9 M17 -38 l-4 9', '#f3efe6', 2.4);
// the leaf's own pale ghost rising from the body, with a halo
const spirit = shape => `<g ${T(54, 66, .5, 6)}>${SHAPES[shape]('#dfe5ea', '#c2ccd6')}</g>` +
  `<ellipse cx="56" cy="24" rx="10" ry="3.2" fill="none" stroke="#c9a23a" stroke-width="2"/>` + hair('M48 68 q-3 3 0 6 M58 69 q3 3 0 6', INK, 1.5);

const RED = ['#e2492f', '#c23a22'], DUST = ['#b9ae9b', '#a3977f'];
const POSE = {
  happy:  { ax: 54, ay: 94, rot: 16, stalk: 'M50 120 Q47 106 54 94', front: sun, rigid: { rot: 10 } },
  hyped:  { ax: 60, ay: 110, sc: .6, rot: 0, stalk: 'M60 121 V110', back: flame, front: '', rigid: { sc: .62, ay: 116 } },
  thanks: { ax: 52, ay: 96, rot: 56, sc: .92, stalk: 'M48 120 Q44 106 52 96', front: heart(28, 44, 1.05), rigid: { rot: 34, ax: 56 } },
  shy:    { ax: 62, ay: 100, rot: -22, sc: .9, stalk: 'M66 121 Q68 110 62 100', flush: true, inner: cheeks, front: '', rigid: { rot: -16, ax: 58 } },
  mad:    { ax: 60, ay: 96, rot: 0, tone: RED, stalk: 'M60 120 V96', front: bolt, rigid: {} },
  sad:    { ax: 68, ay: 46, rot: 158, sc: .84, stalk: 'M54 120 Q40 48 68 46', front: dropInk(93, 114, .55), rigid: { rot: 28, ax: 54, sc: 1 } },
  melt:   { ax: 60, ay: 108, rot: 0, sc: 1.15, sy: .56, pool: true, front: heat(44, 56) + heat(78, 50), rigid: { sc: 1.3, sy: .6, ay: 110 } },
  dead:   { ax: 26, ay: 99, rot: 90, sc: .78, tone: DUST, stalk: 'M12 99 H26', front: spirit, rigid: { ax: 20, ay: 99, sc: .85 } },
};
function moji(shape, tone, emo) {
  const rigid = shape === 'cactus';
  const p = rigid ? { ...POSE[emo], ay: 118, stalk: null, ...POSE[emo].rigid } : POSE[emo];
  const [a, b] = p.tone || tone, sc = p.sc || 1;
  const pool = p.pool ? `<ellipse cx="60" cy="111" rx="42" ry="8" fill="${a}"/>` : '';
  const stalk = p.stalk ? hair(p.stalk) : '';
  const front = typeof p.front === 'function' ? p.front(shape) : p.front;
  return svg(`${p.back || ''}${pool}${stalk}<g ${T(p.ax, p.ay, sc, p.rot, p.sy || sc)}>${SHAPES[shape](a, b)}${p.flush ? SHAPES[shape]('url(#flush)', 'url(#flush)') : ''}${p.inner || ''}</g>${front}`);
}

const EMO = [
  ['happy', 'Happy', 'るんるん'], ['hyped', 'Hyped', 'メラメラ'], ['thanks', 'Thank you', 'ぺこり'], ['shy', 'Embarrassed', 'てれてれ'],
  ['mad', 'Mad', 'ぷんぷん'], ['sad', 'Crying', 'ぴえん'], ['melt', 'Melting', 'とろ〜ん'], ['dead', "I'm dead", 'ち〜ん'],
];
const P = {
  mochi:  ['Mochi', 'Pothos · Osaka', 'heart', ['#2f6b4f', '#24543e']],
  lua:    ['Lua', 'Monstera · São Paulo', 'monstera', ['#1e4d3a', '#163a2c']],
  kogane: ['Kogane', 'Ginkgo · Kyoto', 'ginkgo', ['#d9a441', '#bf8a2b']],
  wren:   ['Wren', 'Fern · Portland', 'fern', ['#7a9f4f', '#5b8139']],
  bjorn:  ['Bjørn', 'Cactus · Oslo', 'cactus', ['#86b3a0', '#679883']],
};
const m = (k, e) => moji(P[k][2], P[k][3], e);

document.getElementById('hero').innerHTML = [['mochi', 'shy', 'てれてれ', 'Embarrassed'], ['kogane', 'hyped', 'メラメラ', 'Hyped'], ['lua', 'dead', 'ち〜ん', "I'm dead"]]
  .map(([k, e, ja, en]) => `<div>${m(k, e)}<div class="cap"><b>${ja}</b>${P[k][0]} · ${en}</div></div>`).join('');

let html = '<div></div>' + EMO.map(e => `<div class="head">${e[2]}<small>${e[1]}</small></div>`).join('');
Object.keys(P).forEach(k => {
  html += `<div class="plant"><b>${P[k][0]}</b><span>${P[k][1]}</span></div>`;
  html += EMO.map(e => `<div class="cell">${m(k, e[0])}</div>`).join('');
});
document.getElementById('table').innerHTML = html;

document.getElementById('chat').innerHTML = [
  `<div class="row"><span class="n">Bjørn · Oslo</span>−6°C by the window. ${m('bjorn', 'mad')}</div>`,
  `<div class="row"><span class="n">Kogane · Kyoto</span>First gold leaf today. ${m('kogane', 'hyped')}</div>`,
  `<div class="row"><span class="n">Lua · São Paulo</span>33°C. Again. ${m('lua', 'melt')}</div>`,
  `<div class="row"><span class="n">Mochi · Osaka</span>The cat sat on me. ${m('mochi', 'dead')}</div>`,
].join('');
</script>
</body>
</html>
